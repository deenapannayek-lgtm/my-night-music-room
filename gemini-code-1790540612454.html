<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Night — Music Room</title>
<!-- Google Font: Pacifico -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07101a;
    color: #f5eee4;
    font-family: Georgia, "Times New Roman", serif;
  }
  body { user-select: none; }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Full-screen photo background */
    background: url('pexels-juanpphotoandvideo-877970.jpg') no-repeat center center / cover;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
    pointer-events: none;
  }

  .top {
    position: absolute;
    top: 20px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 5;
  }

  .clock {
    font: 600 15px/1 monospace;
    letter-spacing: 4px;
    text-shadow: 0 2px 8px #000;
  }

  .status {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font: 13px Arial;
    color: #eee;
    opacity: 0.9;
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #65ef80;
    border-radius: 50%;
    box-shadow: 0 0 9px #65ef80;
    margin-right: 7px;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .pill {
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(12, 15, 20, 0.38);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 10px 14px;
    border-radius: 22px;
    font: 600 13px Arial;
    cursor: pointer;
    transition: 0.2s;
  }

  .pill:hover {
    background: rgba(255, 255, 255, 0.13);
    transform: translateY(-1px);
  }

  .hero {
    position: absolute;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: min(90%, 800px);
    z-index: 3;
  }

  .hero h1 {
    margin: 0;
    font-family: 'Pacifico', cursive; /* Applied Pacifico Font */
    font-size: clamp(55px, 8vw, 110px);
    font-weight: 400;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px #0008;
  }

  .hero p {
    margin: 8px 0 0;
    font: 12px Arial;
    letter-spacing: 7px;
    opacity: 0.7;
  }

  .player {
    position: absolute;
    z-index: 8;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    width: min(650px, calc(100% - 30px));
    background: rgba(30, 23, 21, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 34px;
    padding: 17px 20px;
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
  }

  .playerTop {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cover {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    background: linear-gradient(135deg, #d0a76c, #3b3028 55%, #101817);
    display: grid;
    place-items: center;
    font-size: 25px;
    box-shadow: 0 5px 18px #0008;
  }

  .meta {
    min-width: 0;
    flex: 1;
  }

  .title {
    font: 700 15px Arial;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist {
    font: 13px Arial;
    color: #c7bbb0;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .ctrl {
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    padding: 7px;
  }

  .play {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #f8f1e7;
    color: #261d19;
    font-size: 21px;
  }

  .volume {
    width: 85px;
    accent-color: #eee;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
    font: 11px monospace;
    color: #b9aaa0;
  }

  .progress input {
    flex: 1;
    accent-color: #f5eee4;
  }

  .playlist {
    display: none;
    position: absolute;
    right: 0;
    bottom: 55px;
    width: 280px;
    max-height: 330px;
    overflow: auto;
    background: rgba(17, 17, 20, 0.95);
    border: 1px solid #ffffff25;
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 15px 40px #0009;
  }

  .playlist.open { display: block; }

  .track {
    display: flex;
    gap: 9px;
    align-items: center;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font: 13px Arial;
  }

  .track:hover, .track.active { background: #ffffff12; }

  .empty {
    padding: 20px;
    text-align: center;
    color: #aaa;
    font: 13px Arial;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translate(-50%, 120px);
    background: #111b;
    color: #fff;
    border: 1px solid #fff2;
    padding: 11px 16px;
    border-radius: 20px;
    font: 13px Arial;
    z-index: 20;
    transition: 0.3s;
  }

  .toast.show { transform: translate(-50%, 0); }
  input[type=file] { display: none; }

  @media (max-width: 650px) {
    .status { display: none; }
    .hero { top: 23%; }
    .hero h1 { font-size: 48px; }
    .actions .pill:nth-child(2) { display: none; }
    .player { bottom: 16px; }
    .controls .volume { display: none; }
    .title { max-width: 170px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="vignette"></div>

  <header class="top">
    <div class="clock" id="clock">12:30 AM</div>
    <div class="status"><span class="dot"></span>just you</div>
    <div class="actions">
      <button class="pill" id="addBtn">＋ Add Music</button>
      <button class="pill" id="playlistBtn">Playlist</button>
      <button class="pill" id="ambientBtn">✦ Night</button>
      <input id="files" type="file" accept="audio/*" multiple>
    </div>
  </header>

  <main class="hero">
    <h1>My Night</h1>
    <p>MUSIC • MEMORIES • MIDNIGHT</p>
  </main>

  <div class="playlist" id="playlist">
    <div class="empty">No songs yet.<br>Click “＋ Add Music” to bring your music here.</div>
  </div>

  <section class="player">
    <div class="playerTop">
      <div class="cover">♫</div>
      <div class="meta">
        <div class="title" id="title">Your night starts here</div>
        <div class="artist" id="artist">Add music from your desktop</div>
      </div>
      <div class="controls">
        <button class="ctrl" id="prev">⏮</button>
        <button class="ctrl play" id="play">▶</button>
        <button class="ctrl" id="next">⏭</button>
        <span>🔊</span>
        <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8">
      </div>
    </div>
    <div class="progress">
      <span id="current">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<audio id="audio"></audio>

<script>
  const audio = document.getElementById('audio'), files = document.getElementById('files'), addBtn = document.getElementById('addBtn');
  const playlistEl = document.getElementById('playlist'), playlistBtn = document.getElementById('playlistBtn');
  const play = document.getElementById('play'), title = document.getElementById('title'), artist = document.getElementById('artist');
  const seek = document.getElementById('seek'), volume = document.getElementById('volume'), current = document.getElementById('current'), duration = document.getElementById('duration');
  let tracks = [], index = -1;

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function toast(t) {
    const x = document.getElementById('toast');
    x.textContent = t;
    x.classList.add('show');
    setTimeout(() => x.classList.remove('show'), 2200);
  }

  function render() {
    playlistEl.innerHTML = tracks.length
      ? tracks.map((t, i) => `<div class="track ${i === index ? 'active' : ''}" data-i="${i}"><span>♫</span><span>${escapeHtml(t.name)}</span></div>`).join('')
      : '<div class="empty">No songs yet.<br>Click “＋ Add Music” to bring your music here.</div>';
    playlistEl.querySelectorAll('.track').forEach(x => x.onclick = () => load(+x.dataset.i, true));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function load(i, auto = false) {
    if (!tracks[i]) return;
    index = i;
    const t = tracks[i];
    audio.src = t.url;
    title.textContent = t.name;
    artist.textContent = 'Your local music';
    render();
    if (auto) audio.play().catch(() => {});
  }

  addBtn.onclick = () => files.click();

  files.onchange = () => {
    [...files.files].forEach(f => tracks.push({ name: f.name, url: URL.createObjectURL(f) }));
    if (index < 0 && tracks.length) load(0);
    else render();
    if (files.files.length) toast(files.files.length + ' song' + (files.files.length > 1 ? 's' : '') + ' added');
    files.value = '';
  };

  play.onclick = () => {
    if (!audio.src) { files.click(); return; }
    audio.paused ? audio.play() : audio.pause();
  };

  audio.onplay = () => play.textContent = '❚❚';
  audio.onpause = () => play.textContent = '▶';

  document.getElementById('prev').onclick = () => { if (tracks.length) load((index - 1 + tracks.length) % tracks.length, true); };
  document.getElementById('next').onclick = () => { if (tracks.length) load((index + 1) % tracks.length, true); };
  audio.onended = () => { if (tracks.length) load((index + 1) % tracks.length, true); };

  audio.ontimeupdate = () => {
    seek.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    current.textContent = fmt(audio.currentTime);
  };

  audio.onloadedmetadata = () => duration.textContent = fmt(audio.duration);
  seek.oninput = () => { if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration; };

  volume.oninput = () => audio.volume = volume.value;
  audio.volume = 0.8;

  playlistBtn.onclick = () => playlistEl.classList.toggle('open');
  document.addEventListener('click', e => {
    if (!playlistEl.contains(e.target) && e.target !== playlistBtn) playlistEl.classList.remove('open');
  });

  function clock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toUpperCase();
  }
  clock();
  setInterval(clock, 1000);

  let night = true;
  document.getElementById('ambientBtn').onclick = () => {
    night = !night;
    document.querySelector('.scene').style.filter = night ? '' : 'brightness(1.18) saturate(.8)';
    document.getElementById('ambientBtn').textContent = night ? '✦ Night' : '☀ Dawn';
  };
</script>

</body>
</html>
